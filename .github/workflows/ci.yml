name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: No real-identity leakage in tracked files
        run: |
          # The project ships under the "Judder" pseudonym. Fail if the real
          # owner's name/personal email or a developer home path slips in.
          if git grep -nIE 'aaronjudson|botlesterjudson|aaron@juddex|Judson|Users[/\\]+Aaron' \
               -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Real-identity string found in a tracked file (see matches above)."
            exit 1
          fi
          echo "OK: no real-identity leakage detected."

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so a secret committed in any past commit is caught,
          # not just the latest diff.
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run Ruff
        run: ruff check forven tests

      - name: Collect backend tests
        run: python -m pytest --collect-only -q

      # The WHOLE suite gates now, not a hand-curated allowlist. It previously ran
      # 44 of 546 files (810 of 5769 tests); the ungated 86% accumulated 69
      # failures against deliberate product changes nobody was told about --
      # including the only tests asserting that the kill switch fires, that the
      # paper->live gate enforces its floors, and that the funding math is right.
      # A curated list cannot notice the test it was never given.
      #
      # -n auto shards across the runner's cores (the suite is ~28m serial).
      # --dist loadfile keeps each FILE on one worker: several suites share
      # module-level state (the HyperLiquid SDK fixtures rebuild
      # forven.exchange.hyperliquid), so splitting a file across workers is not
      # safe yet. Order-independence is not something this suite has earned;
      # revisit --dist load once it has.
      - name: Run backend test suite
        run: python -m pytest -q -n auto --dist loadfile

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Run Svelte checks
        run: npm run check

      # The e2e smoke suite boots the REAL backend (python -m forven.api,
      # isolated FORVEN_HOME, control-plane only) behind the vite dev proxy —
      # see frontend/playwright.config.ts — so this job needs Python too.
      - name: Set up Python for e2e backend
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install backend dependencies for e2e
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke tests
        run: npm run test:e2e
