name: Windows full suite

# The whole backend suite on Windows. It takes ~1h40m on a hosted Windows
# runner, so it runs nightly (and on demand from the Actions tab) instead of
# on every PR; ci.yml's `windows` job covers the Windows-specific tests per PR.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  backend-windows:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e . --no-deps

      # Same split as ci.yml's Linux job: parallel lane, then the
      # subprocess-heavy sandbox suites one at a time.
      - name: Run full backend test suite (parallel lane)
        shell: bash
        run: |
          SERIAL_LANE=(
            tests/test_strategy_worker_parity.py
            tests/test_strategy_portability.py
          )
          IGNORE=()
          for f in "${SERIAL_LANE[@]}"; do
            IGNORE+=(--ignore "$f")
          done
          python -m pytest -q -n auto --dist loadfile -rfE --durations=40 "${IGNORE[@]}"

      - name: Run subprocess-heavy suites (serial lane)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python -m pytest -q -rfE \
            tests/test_strategy_worker_parity.py \
            tests/test_strategy_portability.py
